name: Sync Kite instruments

on:
  schedule:
    # 00:30 UTC = 6:00 AM IST — before market open
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: node --version

      - run: npm ci

      - name: Sync instruments to Supabase
        run: node tools/sync-kite-instruments.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
